name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Lets you trigger manually from the Actions UI

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o reminders \
            ./cmd/reminders

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: reminders
          path: reminders
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: reminders

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -i ~/.ssh/deploy_key \
            reminders \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/reminders/reminders.new

      - name: Install binary and restart service
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'set -e
             chmod +x /opt/reminders/reminders.new
             mv /opt/reminders/reminders /opt/reminders/reminders.old
             mv /opt/reminders/reminders.new /opt/reminders/reminders
             sudo systemctl restart reminders.service
             if ! timeout 15 bash -c "until sudo systemctl is-active --quiet reminders.service; do sleep 1; done"; then
               echo "Service failed to start, rolling back"
               mv /opt/reminders/reminders.old /opt/reminders/reminders
               sudo systemctl restart reminders.service
               exit 1
             fi
             whoami && sudo systemctl status reminders.service --no-pager'
